services:
  # Base de Datos Relacional & Vectorial PostgreSQL 15 + pgvector (HNSW)
  db:
    image: pgvector/pgvector:pg15
    container_name: rh_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_rh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-db_recursos_humanos}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin_rh} -d ${POSTGRES_DB:-db_recursos_humanos}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rh_network

  # Caché de Sesiones y Mensajería en Tiempo Real con Redis
  redis:
    image: redis:7-alpine
    container_name: rh_redis
    restart: always
    ports:
      - '${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - rh_network

  # Servidor Backend API Express + Prisma + WebSockets + Almacenamiento Local Persistente
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/jorgedoicela/rh-backend:latest}
    container_name: rh_backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin_rh}:${POSTGRES_PASSWORD:-your_postgres_password_here}@db:5432/${POSTGRES_DB:-db_recursos_humanos}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      CLIENT_URL: ${CLIENT_URL:-https://norma.doicela.dev}
      FRONTEND_URL: ${FRONTEND_URL:-https://norma.doicela.dev}
      ORIGIN: ${ORIGIN:-https://norma.doicela.dev}
      RP_ID: ${RP_ID:-doicela.dev}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-32-byte-hex-key-here}
      SEED_SECRET: ${SEED_SECRET:-your-seed-secret-here}
      RUN_SEED: ${RUN_SEED:-true}
      EMAIL_USER: ${EMAIL_USER:-your-email@example.com}
      EMAIL_PASS: ${EMAIL_PASS:-your-app-password}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_LLM_URL: ${AI_LLM_URL:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-ecuador-erp-ai}
      AI_LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS:-25000}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN:-}
      HF_NAMESPACE: ${HF_NAMESPACE:-doiceladev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE:-}
      DEMO_EMPLOYEE_PHONE: ${DEMO_EMPLOYEE_PHONE:-}
      DEMO_EMPLOYEE_EMAIL: ${DEMO_EMPLOYEE_EMAIL:-}
      DEMO_EMPLOYEE_IDENTITY: ${DEMO_EMPLOYEE_IDENTITY:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_AI_PROVIDER: ${WHATSAPP_AI_PROVIDER:-deepseek}
    healthcheck:
      # Docker verifica que el proceso Node responde activamente, no solo que está corriendo
      # Si el proceso se cuelga o crashea silenciosamente, restart:always lo reinicia sólo
      test: ['CMD-SHELL', 'curl -sf http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - uploads_data:/app/uploads
      - ai_models_data:/app/src/modules/sustainability/data/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rh_network

  # Servidor Frontend Web React SPA (Nginx interno para activos estáticos)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ghcr.io/jorgedoicela/rh-frontend:latest}
    container_name: rh_frontend
    restart: always
    expose:
      - '80'
    networks:
      - rh_network

  # Reverse Proxy & API Gateway Perimetral (Nginx SSL 443 + HTTP 80)
  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-ghcr.io/jorgedoicela/rh-gateway:latest}
    container_name: rh_gateway
    restart: always
    ports:
      - '${GATEWAY_HTTP_PORT:-8080}:80'
      - '${GATEWAY_HTTPS_PORT:-443}:443'
    volumes:
      - ${CERTS_PATH:-certs_data}:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - rh_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certs_data:
  ai_models_data:

networks:
  rh_network:
    driver: bridge
