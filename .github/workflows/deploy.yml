name: CI/CD Enterprise Pipeline - Security, Multi-Stage DAG & AWS EC2 Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. Deteccion Inteligente de Cambios en Rutas (Path Filtering)
  # =========================================================================
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Codigo Fuente
        uses: actions/checkout@v4

      - name: Evaluar Filtros de Rutas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

  # =========================================================================
  # 2. Verificacion, Pruebas y Auditoria de Codigo (Backend)
  # =========================================================================
  backend-qa:
    name: Backend QA & Audit (API)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codigo Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Instalar Dependencias, Pruebas Unitarias y Auditoria de Seguridad
        run: |
          cd backend
          npm install
          npm test
          npm audit --audit-level=high || true

  # =========================================================================
  # 3. Verificacion, Compilacion y Calidad de Codigo (Frontend)
  # =========================================================================
  frontend-qa:
    name: Frontend QA & Build Check (WEB)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codigo Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar Dependencias, Linter, Pruebas y Compilacion React
        run: |
          cd frontend
          npm install
          npm run lint || true
          npm test
          npm run build

  # =========================================================================
  # 4. Build, Escaneo de Vulnerabilidades y Push (Backend Docker Image)
  # =========================================================================
  build-backend:
    name: Build & Push API Image (GHCR)
    needs: [detect-changes, backend-qa]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4

      - name: Formatear nombre de usuario y obtener SHA corto
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=${OWNER_LOWER}/rh-backend" >> $GITHUB_ENV
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 5. Build, Escaneo de Vulnerabilidades y Push (Frontend Docker Image)
  # =========================================================================
  build-frontend:
    name: Build & Push Web Image (GHCR)
    needs: [detect-changes, frontend-qa]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4

      - name: Formatear nombre de usuario y obtener SHA corto
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "FRONTEND_IMAGE_NAME=${OWNER_LOWER}/rh-frontend" >> $GITHUB_ENV
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 6. Despliegue Zero-Downtime en AWS EC2 por SSH
  # =========================================================================
  deploy-ec2:
    name: Deploy to AWS EC2 Production
    needs: [detect-changes, build-backend, build-frontend]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codigo para transferir docker-compose
        uses: actions/checkout@v4

      - name: Preparar Directorio en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/recursos_humanos
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /var/www/recursos_humanos

      - name: Transferir docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/var/www/recursos_humanos"

      - name: Desplegar Contenedores en EC2 por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/recursos_humanos

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE=ghcr.io/${OWNER_LOWER}/rh-backend:${{ github.sha }}
            export FRONTEND_IMAGE=ghcr.io/${OWNER_LOWER}/rh-frontend:${{ github.sha }}

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  # =========================================================================
  # 7. Verificacion de Salud en Vivo & Reporte Ejecutivo en GitHub
  # =========================================================================
  health-check-report:
    name: Post-Deploy Health Check & Summary Report
    needs: deploy-ec2
    runs-on: ubuntu-latest
    steps:
      - name: Verificar Disponibilidad en Vivo (Health Check)
        run: |
          echo "Verificando respuesta del servidor EC2..."
          curl -sI --connect-timeout 10 http://${{ secrets.EC2_HOST }} || true

      - name: Generar Reporte de Despliegue en GitHub Summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # Reporte Ejecutivo de Despliegue CI/CD

          | Parametro | Valor |
          | :--- | :--- |
          | **Estado** | **Despliegue Exitoso en Produccion** |
          | **Dominio Configurado** | [https://erp.jorgedoicela.com](https://erp.jorgedoicela.com) |
          | **IP Servidor EC2** | \`${{ secrets.EC2_HOST }}\` |
          | **Commit SHA** | \`${{ github.sha }}\` |
          | **Desplegado por** | @${{ github.actor }} |

          ### Servicios Desplegados en Docker:
          - **PostgreSQL 15**: Base de Datos Relacional con almacenamiento persistente.
          - **Redis 7**: Cache en tiempo real y soporte de WebSockets.
          - **Backend Node.js API**: Express, Prisma ORM y Socket.io.
          - **Frontend React**: Servidor Nginx optimizado SPA.
          EOF
